<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>

    {% if messages %}
    {% for i in messages %}
        <p style="color: red;"> {{ i }} </p>
    {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <br><br>

        <input type="submit" value="Register">

    </form>

    <a href="{% url 'login' %}">Do you have an account? Let's to login</a>
    
</body>
</html>
